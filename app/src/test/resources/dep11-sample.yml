Releases:
- version: 3.0.4
  type: stable
  unix-timestamp: 1747440000
  description:
    C: >-
      <p>
              This second micro release in the 3.0 series fixes various bugs and improves usability in several parts of the
      interface:
              </p>
      <ul>
        <li>
                MyPaint Brush: tool options layout made more consistent with other paint tools
                </li>
        <li>
                Paths: clicking on the starting point in design mode closes the path</li>
        <li>Scissors Select: pressing Enter connects the start and end points</li>
        <li>Pencil: "Force" slider is now hidden in the tool options</li>
        <li>Dockable dialogs in Windows have titlebars matching the theme's dark mode setting</li>
        <li>Editing non-destructive filters now creates undo steps</li>
        <li>Optimized font loading for faster startup</li>
        <li>Improvements in various file format supports</li>
        <li>And more bug fixes and usability improvements…</li>
      </ul>
- version: 3.0.2
  type: stable
  unix-timestamp: 1742688000
  description:
    C: >-
      <p>
              As could be expected from a major release, a few critical bugs slipped through our testing!
              This first micro-point release fix such bugs.
              </p>
- version: 3.0.0
  type: stable
  unix-timestamp: 1742083200
  description:
    C: >-
      <p>
              Our initial release for the next generation in image manipulation!
              While GIMP 3.0 has too many improvements to make an exhaustive list, here are
              some of the highlights:
              </p>
      <ul>
        <li>Multi-selection of layers in the Layers dockable</li>
        <li>Proper high pixel density display support</li>
        <li>Improved graphics tablets support</li>
        <li>Wayland support</li>
        <li>New soft-proofing toggle in the status bar, with pop-over settings on right click</li>
        <li>
                Initial UI for non-destructive layer effects
                </li>
        <li>
                Paint tools now have an "Expand Layers" option and sub-options to auto-expand layers when painting over their
      boundaries
                </li>
        <li>
                Align and Distribute tool: completely reworked usage
                </li>
        <li>
                Text tool: new "Outlined" and "Outlined and filled" options
                </li>
        <li>
                New "Stroke borders" option in Bucket Fill tool's "Fill by line art detection"
                </li>
        <li>
                Redesigned and reorganized "Fill by line art detection" settings
                </li>
        <li>Deeply reworked API for plug-in developers</li>
        <li>Plug-in API now available in C/C++, Python 3, Javascript, Lua, Vala and more</li>
        <li>Improved support of many image formats</li>
      </ul>
- version: 3.0.0~rc3
  type: development
  unix-timestamp: 1739059200
  description:
    C: >-
      <p>
              While GIMP 3.0 is getting more and more robust with this
              third release candidate, some core changes require more testing.
              Some of the highlights of this version are:
              </p>
      <ul>
        <li>Reworked image graph for even less destructive filters</li>
        <li>BC7 compression support for DDS file import</li>
        <li>Improved PSD support (16-bit per channel LAB import, metadata, etc.)</li>
        <li>Various API improvements for plug-in developers</li>
        <li>Script-Fu: new named-argument syntax for functions generated from PDB procedures</li>
        <li>Many bug fixes and a much more robust base overall</li>
      </ul>
