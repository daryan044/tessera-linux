  NonFreeAdd:
    en-US: The Claude Code shortcut installs Anthropic's Claude Code, which isn't
      free software.
Categories:
  - Development
  - System
License: GPL-3.0-or-later
AuthorName: Daryan Kamaran Karim
SourceCode: https://github.com/daryan044/tessera-linux
IssueTracker: https://github.com/daryan044/tessera-linux/issues
Changelog: https://github.com/daryan044/tessera-linux/releases

AutoName: Tessera

RepoType: git
Repo: https://github.com/daryan044/tessera-linux.git

Builds:
  - versionName: 0.2.0
    versionCode: 2
    commit: 1078ad485248185adf172d64c8880c882f6d1ae0
    subdir: app
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y bison bzip2 curl debootstrap gcc libc6-dev make patch python3
        xz-utils
    gradle:
      - yes
    build:
      - cd ..
      - scripts/proot/build.sh
      - scripts/x11/build-native.sh
      - sudo --preserve-env=PATH,ANDROID_NDK_HOME scripts/gpu/build-mesa.sh
      - sudo chown -R "$(id -u):$(id -g)" build/gpu
      - sudo --preserve-env=PATH,ANDROID_NDK_HOME scripts/usb/build-usb.sh
      - sudo chown -R "$(id -u):$(id -g)" build/usb
      - scripts/theme/build-theme.sh
    ndk: 29.0.14206865
    gradleprops:
      - tessera.unsigned

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: 0.2.0
CurrentVersionCode: 2
