    en-US: The Claude Code shortcut installs Anthropic's Claude Code, which isn't free software.

RepoType: git
Repo: https://github.com/daryan044/tessera-linux.git

Builds:
  - versionName: 0.2.0
    versionCode: 2
    commit: v0.2.0
    subdir: app
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y debootstrap curl python3 xz-utils patch bzip2 make
    gradle:
      - yes
    gradleprops:
      - tessera.unsigned
    ndk: 28.2.13676358
    build:
      # The native parts the APK carries, built from source as CI builds them: PRoot, the X
      # server (Termux:X11's), the GPU driver (Mesa's Turnip and Zink), the USB bridge
      # (libusb) and the theme pack (adw-gtk3, Bibata). The GPU driver and USB bridge are
      # cross-compiled in a Debian trixie chroot, for Debian's glibc inside the app.
      - cd ..
      - scripts/proot/build.sh
      - scripts/x11/build-native.sh
      - sudo --preserve-env=PATH,ANDROID_NDK_HOME scripts/gpu/build-mesa.sh
      - sudo chown -R "$(id -u):$(id -g)" build/gpu
      - sudo --preserve-env=PATH,ANDROID_NDK_HOME scripts/usb/build-usb.sh
      - sudo chown -R "$(id -u):$(id -g)" build/usb
      - scripts/theme/build-theme.sh

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: 0.2.0
CurrentVersionCode: 2
