AutoName: Tessera

RepoType: git
Repo: https://github.com/daryan044/tessera-linux.git

Builds:
  - versionName: 0.2.0
    versionCode: 2
    commit: 39df86211dfa09105aaf30326ed540f412e3afb2
    subdir: app
    submodules: true
    sudo:
      - dpkg --add-architecture arm64
      - apt-get update
      - apt-get install -y --no-install-recommends bison bzip2 crossbuild-essential-arm64
        curl flex gcc glslang-tools libc6-dev make meson ninja-build patch pkgconf
        pkgconf:arm64 python3 python3-mako python3-packaging python3-yaml xz-utils
        libdrm-dev:arm64 libexpat1-dev:arm64 zlib1g-dev:arm64 libzstd-dev:arm64 libx11-dev:arm64
        libxext-dev:arm64 libxfixes-dev:arm64 libxrandr-dev:arm64 libxxf86vm-dev:arm64
        libxshmfence-dev:arm64 libx11-xcb-dev:arm64 libxcb1-dev:arm64 libxcb-glx0-dev:arm64
        libxcb-shm0-dev:arm64 libxcb-dri3-dev:arm64 libxcb-present-dev:arm64 libxcb-randr0-dev:arm64
        libxcb-sync-dev:arm64 libxcb-xfixes0-dev:arm64 libxcb-keysyms1-dev:arm64 libglvnd-dev:arm64
    gradle:
      - yes
    build:
      - cd ..
      - scripts/proot/build.sh
      - scripts/x11/build-native.sh
      - TESSERA_ON_HOST=1 scripts/gpu/build-mesa.sh
      - TESSERA_ON_HOST=1 scripts/usb/build-usb.sh
      - scripts/theme/build-theme.sh
    ndk: 29.0.14206865
    gradleprops:
      - tessera.unsigned

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
