Builds:
  - versionName: 0.2.1
    versionCode: 3
    commit: v0.2.1
    subdir: app
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y debootstrap curl python3 xz-utils patch bzip2 make
    gradle:
      - yes
    build:
      - cd ..
      - scripts/proot/build.sh
      - scripts/x11/build-native.sh
      - sudo --preserve-env=PATH,ANDROID_NDK_HOME scripts/gpu/build-mesa.sh
      - sudo chown -R "$(id -u):$(id -g)" build/gpu
      - sudo --preserve-env=PATH,ANDROID_NDK_HOME scripts/usb/build-usb.sh
      - sudo chown -R "$(id -u):$(id -g)" build/usb
      - scripts/theme/build-theme.sh
    ndk: 28.2.13676358
    gradleprops:
      - tessera.unsigned

